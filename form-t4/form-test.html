<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Test</title>
</head>
<body>
<!--action包含一个路径，用于指定提交的表单数据将发送到哪个页面进行处理   method指定将表单数据发送到服务器时使用的数据传输方法-->
    <form action="/" method="post">
        <h2>请填写表单</h2>
        <p>
            <!-- label标签用于为表单中的输入框添加提示信息-->
            <!-- for与id同值显示关联 -->
            <label for="username">用户名：(如：张三)</label>
            <input type="text" id="username" name="username" value="张三">
            <!--                                value 默认填... required 必填-->
        </p>
        <p>
            <label for="password">密码：(必填项)</label>
            <input type="password" id="password" name="password" required>
        </p>
        <p>
            <label for="email">邮箱：</label>
            <input type="email" id="email" name="email">
        </p>
        <fieldset> <!-- fieldset 将相关表单控件包裹成一个独立逻辑单元  legend 单元标题 （二者绑定） -->
            <legend>确认是否同意协议：</legend>
            <label> <!-- 隐式关联 -->
                <input type="radio" name="agree" value="no"> <!-- radio 单选按钮-->
                    否
            </label>
            <label>
                <input type="radio" name="agree" value="yes" checked> <!-- checked 默认选中-->
                    是
            </label>
        </fieldset>
        <fieldset>
            <legend>喜欢的体育项目：</legend>
            <label>
                <input type="checkbox" name="sport" value="football"> <!-- checkbox 复选框-->
                足球
            </label>
            <label>
                <input type="checkbox" name="sport" value="basketball">
                    篮球
            </label>
            <label>
                <input type="checkbox" name="sport" value="swimming">
                    游泳
            </label>
        </fieldset>
        <!-- 更多关于input：
             专门用于处理特定类型数据的文本字段输入类型，例如：<input type="number">、<input type="password"> 和 <input type="tel">
        -->
        <fieldset disabled>  <!-- disabled 禁用 -->
            <legend>请选择你喜欢的颜色：</legend>
            <label>
                三元色：
                <select> <!-- select 下拉框 -->
                    <option value="red">红色</option>
                    <option value="green">绿色</option>
                    <option value="blue">蓝色</option>
                </select>
                &nbsp&nbsp  <!-- &nbsp 空格-->
            </label>
            <label>
                十六进制色：
                <input type="color">  <!-- color 颜色选择器-->
            </label>
        </fieldset>
        <p>  <!-- textarea 多行文本输入框 -->
            <label for="comments">其他备注：</label>
            <textarea id="comments" name="comments" rows="5" cols="33"></textarea>
        </p>
        <button >提交</button>
    </form>
</body>
</html>
